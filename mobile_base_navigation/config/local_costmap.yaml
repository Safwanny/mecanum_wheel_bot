# controller_server embeds this costmap as a sub-node, so the parameters
# live in the nested namespace. The standalone nav2_costmap_2d node used in
# Phase 3a read a flat namespace instead; the nested form is what an embedded
# costmap needs, and getting it wrong falls back silently to base_link.
local_costmap:
  local_costmap:
    ros__parameters:
      # Rolls with the robot in the odometry frame. Setting this to map is a
      # common copy-paste error that makes the local costmap fight AMCL.
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.30
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Must match the global costmap; see planner.yaml for the derivation.
      # The tightest circle that holds the body at every heading: the
      # circumscribed radius is 0.1547 m (end-cap corner at the wheels' outer
      # faces). Any smaller and some heading puts a corner in the wall.
      robot_radius: 0.155
      # Stated, not left to the 0.01 default: this is the margin for
      # localisation and control error, and it sits on top of the radius.
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        # ObstacleLayer, not VoxelLayer: one planar LiDAR, no 3D sensor.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan tof_obstacles
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.5
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.8
          raytrace_min_range: 0.0
        # The ToF ring sees what the scan plane at 0.0915 m cannot: the 82 mm
        # band between the 9.5 mm ground clearance and that plane, where a
        # shoe or a doorsill stops the robot while being wholly invisible.
        # These clouds are already classified - the floor is filtered out
        # upstream, so no min_obstacle_height games are needed here.
        tof_obstacles:
          topic: /tof/obstacles
          data_type: PointCloud2
          clearing: true
          marking: true
          # Heights are ground referenced: the clouds are published in
          # base_footprint. The classifier already drops overhangs above the
          # 0.0995 m roof; what it still publishes above it is wall, confirmed
          # by a column of zones reaching down to the lowest upward row, so no
          # height cut here - a far wall is only ever seen above the roof.
          min_obstacle_height: 0.0
          max_obstacle_height: 1.2
          # The classifier limits each kind itself: low obstacles 0.4 m, taller
          # ones 1.0 m, walls 2.0 m. This is the outer bound only.
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.2
          raytrace_min_range: 0.0

      inflation_layer:
        # Same values as the global costmap so tuning transfers.
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.22
        cost_scaling_factor: 8.0
