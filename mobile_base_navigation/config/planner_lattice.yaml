# Alternate global planner: the eight-heading motion lattice.
#
# This is an OVERLAY, not a replacement. planning.launch.py loads planner.yaml
# first and this file second, so only the leaves named here change and the
# global_costmap block - footprint, inflation, resolution, sensor ranges, the
# base_footprint frame - stays in exactly one place. Duplicating the costmap
# into a second file is how the two copies start disagreeing.
#
# Selected with motion_profile:=primitive. The default profile is holonomic
# and never loads this file.
#
# The plugin id stays "GridBased" deliberately, even though the profile is
# called GridBasedLattice in the docs. navigate_to_pose_measured_recovery.xml
# runs a PlannerSelector with default_planner="GridBased", so renaming the id
# would need a matching edit to the behaviour tree and to anything else that
# names a planner. Swapping the type under a stable id is what makes this a
# drop-in.
planner_server:
  ros__parameters:
    GridBased:
      plugin: mobile_base_navigation::LatticePlanner

      # One costmap cell. Quantised to a whole number of cells at search time:
      # a diagonal edge of an arbitrary length lands between cell centres and
      # the lattice walks off its own grid after a few expansions. Raising
      # this to 0.10 roughly quarters the state count and coarsens where a
      # heading change may happen; it does not change what the robot can do.
      step_size_m: 0.05

      # Metres per radian, so a ROTATE edge is directly comparable with a
      # TRANSLATE edge's length. At 0.35 a 90 degree heading change costs
      # about 0.55 m of travel, which buys long straight and diagonal runs
      # without making the search refuse to turn. Set it to 0.0 and the plan
      # degenerates into a staircase; set it very high and the robot drives a
      # long way round rather than making one turn.
      turning_cost_weight: 0.35

      # Scales an edge by (1 + weight * cost / 252), keeping the search out of
      # inflated space. Must stay >= 0 - a negative weight makes an edge
      # cheaper than its own length, which breaks the admissibility of the
      # Euclidean heuristic and quietly turns A* into "first path found".
      cost_penalty_weight: 2.0

      # Tighter than GridBased's 0.125 with SmacPlanner2D, because the path
      # ends at a lattice CELL CENTRE and the controller stops there: this
      # tolerance is a floor under the final position error, not just a search
      # relaxation. At 0.05 the shortfall stays well inside the goal checker's
      # xy_goal_tolerance of 0.15.
      tolerance: 0.05

      max_planning_time: 2.0

      # Matches the GridBased block in planner.yaml. Unknown space is as
      # impassable as a wall until that is relaxed deliberately.
      allow_unknown: false

      # A start yaw parked near a 22.5 degree boundary snaps to whichever side
      # estimator noise pushes it, and the plan's first segment then alternates
      # between two primitives on consecutive replans while the robot sits
      # still. This is how much better a new heading must be before the
      # previous one is given up.
      heading_snap_hysteresis_deg: 5.0
