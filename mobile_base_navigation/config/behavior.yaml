behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0

    # Motion recoveries are enabled from Phase 3c, on measurement rather than
    # on faith. Rotating in place for a full turn changed the closest measured
    # obstacle distance by 0.01 m - the circular footprint sweeps nothing
    # extra, unlike the rectangular and legged bases the stock warning is
    # written for. drive_on_heading and assisted_teleop stay unloaded: nothing
    # invokes them, and an unused actuating behaviour is only a liability.
    behavior_plugins: ["wait", "spin", "backup"]
    wait:
      plugin: "nav2_behaviors::Wait"
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"

    local_frame: odom
    global_frame: map
    # Nav2 defaults this to base_link. This repo's chain is
    # odom -> base_footprint, the same trap the costmaps carry.
    robot_base_frame: base_footprint
    transform_tolerance: 0.30
    simulate_ahead_time: 2.0

    # Kept below the stock 1.0 / 0.4 / 3.2 so that if a motion behavior is ever
    # enabled it starts inside the 0.30 rad/s envelope everything was
    # characterised at, rather than several times outside it.
    # Doubled alongside the drive speeds. Recoveries run close to obstacles,
    # so this is the one place where the doubling is least comfortable: a spin
    # that misjudges clearance now does so twice as fast.
    max_rotational_vel: 1.20
    min_rotational_vel: 0.40
    rotational_acc_lim: 2.0
