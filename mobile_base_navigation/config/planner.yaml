planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ['GridBased']

    GridBased:
      # Jazzy requires the '::' plugin separator. Confirmed against
      # /opt/ros/jazzy/share/nav2_smac_planner/smac_plugin_2d.xml.
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      # Refuse unmapped space for now; relax deliberately later.
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      # Nav2 defaults to base_link; this repo's chain is odom -> base_footprint.
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.30
      # The real body, 260 x 168 mm (corners at the wheels' outer faces, the
      # 0.1547 m circumscribed radius). A circle of that radius was 71 mm
      # wider than the body on each side and shut every gap under ~0.33 m;
      # the rectangle lets the holonomic base strafe through anything wider
      # than the body. Turning in place still needs the full circle, and the
      # footprint-checking critics see that heading by heading.
      footprint: "[[0.13, 0.084], [0.13, -0.084], [-0.13, -0.084], [-0.13, 0.084]]"
      # Margin for localisation and control error on top of the body.
      footprint_padding: 0.005
      # Matches the saved map resolution exactly.
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        # Without this the latched map published before subscription is lost.
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.5
          # Below the 4.0 m LiDAR maximum, so max-range returns never mark.
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          # Slightly beyond obstacle range so free space clears properly.
          raytrace_max_range: 3.8
          raytrace_min_range: 0.0
        # The ToF ring is deliberately absent here. The global costmap lives
        # in the map frame and never rolls, so anything marked in it persists
        # for the whole run. A near-field sensor feeding it accumulates the
        # union of every transient mark it has ever made, and the robot ends up
        # enclosed by its own history. The ToF ring marks the local costmap
        # only, which rolls with the robot and forgets.

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Soft cost only - it decides how much the plan pays to pass close,
        # never whether it may. Smac2D plans the centre point, so this is
        # what keeps paths off walls; 0.18 with the steep factor makes a
        # gap's centre line cheap while still letting the plan through a
        # gap barely wider than the 168 mm body, which MPPI then strafes.
        inflation_radius: 0.18
        # Shapes the gradient only; it does not resize the cleared region.
        cost_scaling_factor: 8.0
