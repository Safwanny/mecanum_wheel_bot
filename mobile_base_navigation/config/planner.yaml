planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ['GridBased']

    GridBased:
      # Jazzy requires the '::' plugin separator. Confirmed against
      # /opt/ros/jazzy/share/nav2_smac_planner/smac_plugin_2d.xml.
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      # Refuse unmapped space for now; relax deliberately later.
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      # Nav2 defaults to base_link; this repo's chain is odom -> base_footprint.
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.30
      # Circumscribed radius of the base is 0.1547 m, set by the corner of a
      # full-width bumper cap; a circular footprint suits a holonomic base
      # with no preferred heading. Raising chassis_length pushes that corner
      # further out, so this value moves with it.
      # The tightest circle that holds the body at every heading: the
      # circumscribed radius is 0.1547 m (end-cap corner at the wheels' outer
      # faces). Any smaller and some heading puts a corner in the wall.
      robot_radius: 0.155
      # Stated, not left to the 0.01 default: this is the margin for
      # localisation and control error, and it sits on top of the radius.
      footprint_padding: 0.01
      # Matches the saved map resolution exactly.
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        # Without this the latched map published before subscription is lost.
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.5
          # Below the 4.0 m LiDAR maximum, so max-range returns never mark.
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          # Slightly beyond obstacle range so free space clears properly.
          raytrace_max_range: 3.8
          raytrace_min_range: 0.0
        # The ToF ring is deliberately absent here. The global costmap lives
        # in the map frame and never rolls, so anything marked in it persists
        # for the whole run. A near-field sensor feeding it accumulates the
        # union of every transient mark it has ever made, and the robot ends up
        # enclosed by its own history. The ToF ring marks the local costmap
        # only, which rolls with the robot and forgets.

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Cut to the minimum that still gives the controller a gradient:
        # 0.22 is 5.5 cm past the padded radius (0.165), where 0.30 was 13.5.
        # Inflation is soft cost, never lethal - it only decides how much the
        # plan pays to pass close - so shrinking it opens narrow passages
        # without letting the body closer than robot_radius + padding. The
        # steep factor keeps cost high right at the edge and near zero a few
        # centimetres out, so a doorway's centre line is cheap.
        # 0.925 m north gap: 0.925 - 2 * 0.22 = 0.485 m band of zero cost.
        inflation_radius: 0.22
        # Shapes the gradient only; it does not resize the cleared region.
        cost_scaling_factor: 8.0
