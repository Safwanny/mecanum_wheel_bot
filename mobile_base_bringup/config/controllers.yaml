controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mobile_base_controller:
      type: mecanum_drive_controller/MecanumDriveController

mobile_base_controller:
  ros__parameters:
    reference_timeout: 0.5

    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint

    kinematics:
      base_frame_offset: {x: 0.0, y: 0.0, theta: 0.0}
      wheels_radius: 0.02996
      # Rev D geometry is 0.105 + 0.09325 = 0.19825. Calibrated against
      # Gazebo ground truth: at 0.17481 odometry read 136.9 deg for a true
      # 131.0 deg turn, so 0.17481 * 136.9 / 131.0. Model-coupled like the
      # prototype's (docs/mecanum_motion_accuracy.md); re-measure on hardware.
      sum_of_robot_center_projection_on_X_Y_axis: 0.18268

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    tf_frame_prefix_enable: false
    tf_frame_prefix: ""
    # Conservative, constant diagnostic covariances. Lateral mecanum velocity
    # is intentionally assigned less confidence than forward velocity.
    pose_covariance_diagonal: [0.05, 0.10, 1000000.0, 1000000.0, 1000000.0, 0.10]
    twist_covariance_diagonal: [0.02, 0.08, 1000000.0, 1000000.0, 1000000.0, 0.03]
