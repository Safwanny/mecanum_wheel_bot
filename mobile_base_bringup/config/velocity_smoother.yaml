# RESOLVED in Phase 3b. The previously recorded stale-command defect -- ~9.5 s
# of the last command being republished after input stopped, which would have
# defeated the controller's reference_timeout -- does NOT reproduce with
# properly stamped input. It was the artefact the old note suspected: the
# original test drove the node with `ros2 topic pub`, leaving header.stamp at
# zero, and velocity_timeout is evaluated against message time.
#
# Measured in simulation with a publisher stamping from the sim clock, teleop
# at 0.10 m/s for 3 s into a live twist_mux -> smoother chain:
#   - while input flows, the output tracks it exactly;
#   - when input genuinely stops, the smoother's output stops too, within the
#     same 0.5 s window as its input. It does not republish.
#
# One characteristic worth knowing rather than assuming: on input loss the
# smoother goes SILENT, it does not ramp down to zero. Deceleration limits
# apply to commanded decelerations, not to command loss. The stop on input
# loss therefore comes from the controller's reference_timeout as a step, not
# as a ramp -- which is the fail-safe direction (silence stops the robot), but
# it is not a smooth stop.
#
# Acceleration limiting was already known to work: driving 0.15 m/s from rest
# puts 0.05 then 0.10 then 0.15 on the reference topic, exactly the max_accel
# of 1.0 m/s^2 at 20 Hz.
#
# The default stays false. That is now a scope choice, not a safety hold: the
# odometry evaluation campaign needs exact constant twists reaching the
# controller, and enabling it by default is a separate decision.
velocity_smoother:
  ros__parameters:
    # The stock Jazzy mecanum_drive_controller exposes no velocity or
    # acceleration parameters at all -- its whole parameter set is joint names,
    # kinematics, covariances, TF settings and reference_timeout -- so a
    # dropped command is a step change straight to zero. The smoother adds
    # these limits without requiring a controller fork.
    smoothing_frequency: 20.0
    scale_velocities: false

    # OPEN_LOOP ramps from the last commanded value rather than from measured
    # odometry, so the smoother does not depend on the odometry chain it is
    # partly there to protect.
    feedback: "OPEN_LOOP"

    # Order is [x, y, theta]. y must be non-zero: this base is holonomic, and
    # a zero lateral limit would silently forbid strafing.
    max_velocity: [0.5, 0.5, 2.0]
    min_velocity: [-0.5, -0.5, -2.0]

    # Deceleration is deliberately stronger than acceleration so stopping is
    # prioritized over ramp-up.
    max_accel: [1.0, 1.0, 3.0]
    max_decel: [-1.5, -1.5, -4.0]

    # Must stay zero. nav2's smoother assigns last_cmd_ before zeroing, so a
    # deadband placed in the feedback path erases each tick's ramp increment
    # and the robot never accelerates.
    deadband_velocity: [0.0, 0.0, 0.0]

    # Matches the controller's reference_timeout so both stages give up on a
    # stale command at the same moment.
    velocity_timeout: 0.5

    # TwistStamped is opt-in on Jazzy and the default only from Kilted. The
    # controller's reference topic is TwistStamped, so without this the
    # smoother publishes Twist and nothing reaches the controller.
    enable_stamped_cmd_vel: true
