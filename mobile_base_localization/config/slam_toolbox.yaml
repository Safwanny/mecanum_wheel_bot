slam_toolbox:
  ros__parameters:
    # Solver settings shipped and supported by slam_toolbox 2.8 on Jazzy.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Phase 1 owns odom -> base_footprint. SLAM adds only map -> odom.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    use_map_saver: true

    # The simulated scan is 10 Hz, 360 degrees, 0.10-4.0 m, with 0.01 m noise.
    throttle_scans: 1
    scan_queue_size: 5
    transform_publish_period: 0.05
    map_update_interval: 2.0
    resolution: 0.05
    min_laser_range: 0.10
    max_laser_range: 4.0
    minimum_time_interval: 0.10
    transform_timeout: 0.20
    tf_buffer_duration: 30.0
    restamp_tf: false
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    debug_logging: false

    # Small thresholds retain lateral and diagonal motion from the 0.216 m base.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.04
    minimum_travel_heading: 0.05
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 1.5

    # Loop closure tightened above the Jazzy reference defaults. The 4.0 m
    # LiDAR cannot see across this 10 x 8 m room, so the centre is a
    # feature-poor dead zone and the four long walls look alike to the
    # matcher. Marginal matches there rotate the whole pose graph.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.60
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 1.0
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
